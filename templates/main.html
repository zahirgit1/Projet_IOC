<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual ESP32 Attack Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: #fff;
            padding: 30px 10px;
        }
        h1 {
            margin-bottom: 30px;
            color: #e0e0e0;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .control-panel {
            background-color: #2a2a2a;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 25px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .control-panel h2 {
            margin-top: 0;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }
        .topic-info {
            font-size: 13px;
            color: #888;
            margin-top: -5px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            margin: 15px auto;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            transition: 0.1s;
            width: 80%;
        }
        .btn-freeze {
            background-color: #00a2ff;
            box-shadow: 0 4px #0066a3;
        }
        .btn-freeze:active {
            box-shadow: 0 1px #0066a3;
            transform: translateY(3px);
        }
        .btn-lightning {
            background-color: #ffcc00;
            color: #000;
            box-shadow: 0 4px #b38f00;
        }
        .btn-lightning:active {
            box-shadow: 0 1px #b38f00;
            transform: translateY(3px);
        }
        .status {
            margin-top: 25px;
            font-size: 18px;
            background: #111;
            padding: 10px;
            border-radius: 6px;
        }
        .status strong {
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <h1>Dual ESP32 Combat Interface</h1>

    <div class="container">
        
        <div class="control-panel">
            <h2>ESP32 - Unit 1</h2>
            <div class="topic-info">Topic: ESP32/freeze</div>
            
            <a href="/esp1/freeze" class="btn btn-freeze">❄️ Freeze </a>
            <a href="/esp1/lightning" class="btn btn-lightning">⚡ Lightning </a>
            
            <div class="status">
                State: <strong>{{ status.esp32_1 }}</strong>
            </div>
        </div>

        <div class="control-panel">
            <h2>ESP32 - Unit 2</h2>
            <div class="topic-info">Topic: ESP32/zap</div>
            
            <a href="/esp2/freeze" class="btn btn-freeze">❄️ Freeze </a>
            <a href="/esp2/lightning" class="btn btn-lightning">⚡ Lightning </a>
            
            <div class="status">
                State: <strong>{{ status.esp32_2 }}</strong>
            </div>
        </div>

    </div>

</body>
</html>
